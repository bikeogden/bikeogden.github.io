<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" role="img" aria-labelledby="jt jd">
  <title id="jt">Ogden to Jenner continuation</title>
  <desc id="jd">After Ogden at 8:30 the ride continues west on Walton, south on Clark, west on Delaware and Locust past the Moody campus, north on Hudson, west on Oak and north on Cleveland, reaching Jenner at 8:40.</desc>

  <rect width="1240" height="800" fill="#FBFAF7"/>

  <g transform="translate(60,66)">

    <!-- minor streets -->
    <g stroke="#E3E0D8" stroke-width="7" stroke-linecap="round">
      <line x1="320" y1="0" x2="320" y2="700"/>
      <line x1="820" y1="0" x2="820" y2="700"/>
      <line x1="1120" y1="0" x2="1120" y2="700"/>
      <line x1="0" y1="180" x2="1126" y2="180"/>
      <line x1="0" y1="352" x2="1126" y2="352"/>
    </g>

    <!-- major streets -->
    <g stroke="#D2CEC3" stroke-width="11" stroke-linecap="round">
      <line x1="120" y1="0" x2="120" y2="700"/>
      <line x1="240" y1="0" x2="240" y2="700"/>
      <line x1="720" y1="0" x2="720" y2="700"/>
      <line x1="920" y1="0" x2="920" y2="700"/>
      <line x1="0" y1="42" x2="1126" y2="42"/>
      <line x1="0" y1="280" x2="1126" y2="280"/>
      <line x1="0" y1="416" x2="1126" y2="416"/>
      <line x1="0" y1="480" x2="1126" y2="480"/>
      <line x1="0" y1="680" x2="1126" y2="680"/>
    </g>

    <!-- Moody campus block -->
    <rect x="724" y="356" width="92" height="120" rx="5" fill="#EAE6DA"/>
    <text x="770" y="422" text-anchor="middle"
          font-family="Public Sans, Helvetica, Arial, sans-serif"
          font-size="15" fill="#8A8570">Moody</text>

    <!-- Cabrini area label -->
    <text x="300" y="600" text-anchor="middle"
          font-family="Public Sans, Helvetica, Arial, sans-serif"
          font-size="16" fill="#8A8570">Cabrini</text>

    <!-- the continuation route -->
    <polyline points="1072,416 920,416 920,480 240,480 240,280 120,280 120,42"
              fill="none" stroke="#41B6E6" stroke-width="15"
              stroke-linecap="round" stroke-linejoin="round"/>

    <!-- direction arrows -->
    <g fill="#FBFAF7">
      <path d="M1010 408 l-16 8 16 8 z"/>
      <path d="M600 472 l-16 8 16 8 z"/>
      <path d="M232 372 l8 -16 8 16 z"/>
      <path d="M112 150 l8 -16 8 16 z"/>
    </g>

    <!-- schools -->
    <g>
      <rect x="1056" y="394" width="32" height="28" rx="3" fill="#14213D"/>
      <path d="M1056 394 l16 -12 16 12 z" fill="#14213D"/>
      <rect x="1064" y="405" width="6" height="11" fill="#FBFAF7"/>
      <rect x="1075" y="405" width="6" height="6" fill="#FBFAF7"/>
    </g>
    <g>
      <rect x="104" y="20" width="32" height="28" rx="3" fill="#14213D"/>
      <path d="M104 20 l16 -12 16 12 z" fill="#14213D"/>
      <rect x="112" y="31" width="6" height="11" fill="#FBFAF7"/>
      <rect x="123" y="31" width="6" height="6" fill="#FBFAF7"/>
    </g>

    <!-- times -->
    <g font-family="Public Sans, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#14213D">
      <text x="1046" y="382" text-anchor="end">8:30</text>
      <text x="150" y="16" text-anchor="start">8:40</text>
    </g>

    <!-- school names -->
    <g font-family="Public Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#14213D">
      <text x="1046" y="446" text-anchor="end">Ogden East</text>
      <text x="150" y="44" text-anchor="start">Jenner</text>
    </g>

    <!-- north-south street labels -->
    <g font-family="Public Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#4A5578">
      <text x="120" y="-22" text-anchor="middle" font-weight="600" fill="#14213D">Cleveland</text>
      <text x="240" y="-22" text-anchor="middle" font-weight="600" fill="#14213D">Hudson</text>
      <text x="320" y="-22" text-anchor="middle">Sedgwick</text>
      <text x="720" y="-22" text-anchor="middle" font-weight="600" fill="#14213D">Wells</text>
      <text x="820" y="-22" text-anchor="middle">LaSalle</text>
      <text x="920" y="-22" text-anchor="middle" font-weight="600" fill="#14213D">Clark</text>
      <text x="1120" y="-22" text-anchor="middle">State</text>
    </g>

    <!-- east-west street labels -->
    <g font-family="Public Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#4A5578">
      <text x="1138" y="48" font-weight="600" fill="#14213D">Elm</text>
      <text x="1138" y="186">Hill</text>
      <text x="1138" y="286" font-weight="600" fill="#14213D">Oak</text>
      <text x="1138" y="422" font-weight="600" fill="#14213D">Walton</text>
      <text x="1138" y="486" font-weight="600" fill="#14213D">Delaware</text>
      <text x="1138" y="686">Chicago</text>
    </g>

    <!-- Locust callout -->
    <text x="470" y="512" text-anchor="middle"
          font-family="Public Sans, Helvetica, Arial, sans-serif"
          font-size="16" fill="#4A5578">Locust</text>

    <!-- north arrow -->
    <g transform="translate(500,660)">
      <path d="M0 30 L0 -6" stroke="#4A5578" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M0 -14 l7 14 -14 0 z" fill="#4A5578"/>
      <text x="0" y="50" text-anchor="middle"
            font-family="Public Sans, Helvetica, Arial, sans-serif"
            font-size="16" font-weight="700" fill="#4A5578">N</text>
    </g>
  </g>
</svg>
