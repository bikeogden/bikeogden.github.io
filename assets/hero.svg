<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">Ogden Bike Bus</title>
  <desc id="d">A group of adults and children riding bikes together in a green protected bike lane, with a city skyline behind them.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCF0FA"/>
      <stop offset="100%" stop-color="#FBFAF7"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="520" rx="10"/></clipPath>

    <g id="wheel">
      <circle r="21" fill="none" stroke="#14213D" stroke-width="5"/>
      <circle r="3.4" fill="#14213D"/>
    </g>

    <!-- adult rider -->
    <g id="adult">
      <use href="#wheel" x="-34" y="0"/>
      <use href="#wheel" x="34" y="0"/>
      <path d="M-34 0 L-4 -34 L34 0 M-4 -34 L18 -34 M-4 -34 L-2 -6"
            fill="none" stroke="#14213D" stroke-width="5" stroke-linecap="round"/>
      <path d="M-2 -6 L14 -24" fill="none" stroke="#14213D" stroke-width="5" stroke-linecap="round"/>
      <path d="M4 -46 L10 -70 L26 -62 L34 -36"
            fill="none" stroke="#14213D" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="34" cy="-82" r="13" fill="#14213D"/>
      <path d="M21 -86 a13 13 0 0 1 26 0 z" fill="#F2C230"/>
    </g>

    <!-- child rider -->
    <g id="child">
      <use href="#wheel" x="-22" y="8" transform="scale(0.66) translate(0 12)"/>
      <use href="#wheel" x="22" y="8" transform="scale(0.66) translate(0 12)"/>
      <path d="M-22 12 L-2 -12 L22 12 M-2 -12 L12 -12"
            fill="none" stroke="#14213D" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M2 -22 L6 -40 L18 -34 L23 -14"
            fill="none" stroke="#14213D" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="24" cy="-50" r="10.5" fill="#14213D"/>
      <path d="M13.5 -53 a10.5 10.5 0 0 1 21 0 z" fill="#41B6E6"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="520" fill="url(#sky)"/>

    <!-- skyline -->
    <g fill="#C9D9E4">
      <rect x="40" y="150" width="74" height="250"/>
      <rect x="126" y="96" width="52" height="304"/>
      <rect x="190" y="196" width="88" height="204"/>
      <rect x="292" y="128" width="60" height="272"/>
      <rect x="316" y="88" width="12" height="40"/>
      <rect x="366" y="216" width="96" height="184"/>
      <rect x="476" y="140" width="66" height="260"/>
      <rect x="556" y="184" width="80" height="216"/>
      <rect x="650" y="110" width="56" height="290"/>
      <rect x="672" y="70" width="10" height="40"/>
      <rect x="720" y="200" width="92" height="200"/>
      <rect x="826" y="156" width="64" height="244"/>
      <rect x="904" y="212" width="86" height="188"/>
      <rect x="1004" y="132" width="58" height="268"/>
      <rect x="1076" y="192" width="88" height="208"/>
    </g>
    <g fill="#FBFAF7" opacity=".5">
      <rect x="54" y="172" width="10" height="14"/><rect x="76" y="172" width="10" height="14"/>
      <rect x="54" y="206" width="10" height="14"/><rect x="90" y="206" width="10" height="14"/>
      <rect x="140" y="126" width="9" height="13"/><rect x="158" y="126" width="9" height="13"/>
      <rect x="140" y="160" width="9" height="13"/><rect x="158" y="194" width="9" height="13"/>
      <rect x="206" y="220" width="10" height="14"/><rect x="238" y="220" width="10" height="14"/>
      <rect x="206" y="256" width="10" height="14"/><rect x="252" y="256" width="10" height="14"/>
      <rect x="306" y="158" width="9" height="13"/><rect x="328" y="192" width="9" height="13"/>
      <rect x="382" y="242" width="10" height="14"/><rect x="418" y="242" width="10" height="14"/>
      <rect x="382" y="278" width="10" height="14"/><rect x="436" y="278" width="10" height="14"/>
      <rect x="492" y="170" width="9" height="13"/><rect x="516" y="170" width="9" height="13"/>
      <rect x="492" y="206" width="9" height="13"/><rect x="516" y="242" width="9" height="13"/>
      <rect x="572" y="210" width="10" height="14"/><rect x="606" y="210" width="10" height="14"/>
      <rect x="572" y="246" width="10" height="14"/><rect x="606" y="282" width="10" height="14"/>
      <rect x="664" y="140" width="9" height="13"/><rect x="686" y="140" width="9" height="13"/>
      <rect x="664" y="176" width="9" height="13"/><rect x="686" y="212" width="9" height="13"/>
      <rect x="736" y="226" width="10" height="14"/><rect x="770" y="226" width="10" height="14"/>
      <rect x="736" y="262" width="10" height="14"/><rect x="788" y="262" width="10" height="14"/>
      <rect x="842" y="184" width="9" height="13"/><rect x="866" y="184" width="9" height="13"/>
      <rect x="842" y="220" width="9" height="13"/><rect x="866" y="256" width="9" height="13"/>
      <rect x="920" y="238" width="10" height="14"/><rect x="954" y="238" width="10" height="14"/>
      <rect x="920" y="274" width="10" height="14"/><rect x="968" y="274" width="10" height="14"/>
      <rect x="1020" y="162" width="9" height="13"/><rect x="1042" y="162" width="9" height="13"/>
      <rect x="1020" y="198" width="9" height="13"/><rect x="1042" y="234" width="9" height="13"/>
      <rect x="1092" y="218" width="10" height="14"/><rect x="1126" y="218" width="10" height="14"/>
      <rect x="1092" y="254" width="10" height="14"/><rect x="1140" y="254" width="10" height="14"/>
    </g>

    <!-- street -->
    <rect x="0" y="400" width="1200" height="120" fill="#EDEAE2"/>
    <rect x="0" y="400" width="1200" height="6" fill="#D6D2C8"/>

    <!-- protected bike lane -->
    <rect x="0" y="418" width="1200" height="86" fill="#007A3D"/>
    <g fill="#FBFAF7" opacity=".85">
      <rect x="24" y="414" width="52" height="5"/><rect x="112" y="414" width="52" height="5"/>
      <rect x="200" y="414" width="52" height="5"/><rect x="288" y="414" width="52" height="5"/>
      <rect x="376" y="414" width="52" height="5"/><rect x="464" y="414" width="52" height="5"/>
      <rect x="552" y="414" width="52" height="5"/><rect x="640" y="414" width="52" height="5"/>
