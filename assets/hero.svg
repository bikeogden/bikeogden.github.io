      <rect x="1080" y="414" width="52" height="5"/>
    </g>

    <!-- riders -->
    <g>
      <use href="#adult" x="150" y="470"/>
      <use href="#child" x="286" y="470"/>
      <use href="#child" x="392" y="470"/>
      <use href="#adult" x="516" y="470"/>
      <use href="#child" x="648" y="470"/>
      <use href="#child" x="752" y="470"/>
      <use href="#child" x="856" y="470"/>
      <use href="#adult" x="988" y="470"/>
    </g>
